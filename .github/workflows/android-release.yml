name: Android Release

on:
  push:
    tags:
      - '*' # Triggers whenever any new Git tag is pushed

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for creating GitHub Releases and uploading assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Automatically caches Gradle dependencies

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # STUB: Android Keystore setup
      # To enable signing, go to GitHub Repository Settings -> Secrets and variables -> Actions
      # Add the following secrets:
      # KEYSTORE_BASE64: base64 encoded version of your .jks or .keystore file
      # KEY_ALIAS: your keystore key alias
      # KEY_PASSWORD: password for the specific key
      # STORE_PASSWORD: password for the keystore itself
      - name: Decode Keystore (Stub)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release-keystore.jks

      - name: Build Release APK and AAB
        env:
          # Make secrets available as environment variables for your app/build.gradle.kts to consume
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Automatically attaches the built APK and AAB to the release generated for this tag
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true # Auto-generates release notes based on PRs and commits
